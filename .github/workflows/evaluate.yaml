name: Evaluate CNCF Project OTel Maturity

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'CNCF project name (e.g. jaeger)'
        required: true
        type: string
      project_url:
        description: 'CNCF project GitHub URL (e.g. https://github.com/jaegertracing/jaeger)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Evaluation setup ─────────────────────────────────────────────────

      - name: Install kind
        run: |
          sudo curl -fsSL https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 -o /usr/local/bin/kind
          sudo chmod +x /usr/local/bin/kind
          kind version

      - name: Install helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          sudo tar -xzf /tmp/helm.tar.gz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          helm version

      - name: Set up OTel evaluation cluster
        run: bash scripts/setup-otel-cluster.sh "${{ github.event.inputs.project_name }}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ── Shared directories ────────────────────────────────────────────────
      # .otel-eval/ is where all three agents write their output (per skills).
      # results/ is cloned from otel-maturity/results so agents can find
      # previous evaluation data via their controllers' results/{project}/ check.

      - name: Create shared .otel-eval directory
        run: |
          mkdir -p "${{ github.workspace }}/.otel-eval/${{ github.event.inputs.project_name }}"
          chmod -R 777 "${{ github.workspace }}/.otel-eval"

      - name: Clone previous results
        run: |
          git clone --depth 1 https://github.com/otel-maturity/results.git \
            "${{ github.workspace }}/previous-results" || {
            echo "No previous results repo found — starting fresh"
            mkdir -p "${{ github.workspace }}/previous-results"
          }

      # ── Step 1: Install Agent ────────────────────────────────────────────

      - name: Start install-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS_API_KEY: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS_API_KEY }}
          DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
        run: |
          docker run -d --name install-agent \
            --network=host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}" \
            -e OTEL_EXPORTER_OTLP_HEADERS_API_KEY="${OTEL_EXPORTER_OTLP_HEADERS_API_KEY}" \
            -e DASH0_DATASET="${DASH0_DATASET}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp:/tmp \
            -v ${{ github.workspace }}/.otel-eval:/app/.otel-eval \
            -v ${{ github.workspace }}/previous-results:/app/results:ro \
            ghcr.io/${{ github.repository }}/install-agent:latest

      - name: Wait for install-agent to be ready
        run: |
          echo "Waiting for install-agent on port 8080..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/; then
              echo "Ready (attempt ${i})"
              exit 0
            fi
            echo "  ${i}/30 — sleeping 3s"
            sleep 3
          done
          echo "install-agent did not start within 90s"
          docker logs install-agent
          exit 1

      - name: Run installation
        id: install
        continue-on-error: true
        run: |
          echo "Installing: ${{ github.event.inputs.project_name }}"
          set +o pipefail
          curl -sS -N -X POST http://localhost:8080/api/chat \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -d "{\"conversationId\": \"install-${{ github.event.inputs.project_name }}\", \"clusterName\": \"otel-eval-${{ github.event.inputs.project_name }}\", \"projectName\": \"${{ github.event.inputs.project_name }}\", \"projectUrl\": \"${{ github.event.inputs.project_url }}\", \"message\": \"The kind cluster otel-eval-${{ github.event.inputs.project_name }} is already running with the OTel Collector and test backend deployed. Install the project and generate the INSTALL-PLAN.md.\"}" \
            --max-time 3600 2>install-curl-errors.txt | tee install-response.txt
          CURL_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          if [[ $CURL_EXIT -ne 0 ]]; then
            echo "## Installation request failed" > install-errors.txt
            echo "" >> install-errors.txt
            echo "curl exited with code \`$CURL_EXIT\`" >> install-errors.txt
            if [[ -s install-curl-errors.txt ]]; then
              echo '```' >> install-errors.txt
              cat install-curl-errors.txt >> install-errors.txt
              echo '```' >> install-errors.txt
            fi
            exit $CURL_EXIT
          fi

      - name: Copy artifacts and stop install-agent
        if: always()
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"
          HOST_DIR="${{ github.workspace }}/.otel-eval/${PROJECT}"

          echo "── Files inside install-agent container:"
          docker exec install-agent find /app -maxdepth 1 -type f -name "*.md" -o -name "*.html" 2>/dev/null || true
          docker exec install-agent find /app/.otel-eval -type f 2>/dev/null || true

          # Copy from all possible locations inside the container
          docker cp "install-agent:/app/.otel-eval/${PROJECT}/." "${HOST_DIR}/" 2>/dev/null || true

          echo "── Files on host after extraction:"
          find "${HOST_DIR}" -type f 2>/dev/null || echo "  (none)"

          docker logs install-agent > install-agent-logs.txt 2>&1 || true
          docker stop install-agent || true
          docker rm install-agent || true

      - name: Verify INSTALL-PLAN.md exists
        id: check_install
        run: |
          INSTALL_PLAN="${{ github.workspace }}/.otel-eval/${{ github.event.inputs.project_name }}/INSTALL-PLAN.md"
          if [[ -f "$INSTALL_PLAN" ]]; then
            echo "INSTALL-PLAN.md found ($(wc -l < "$INSTALL_PLAN") lines)"
            echo "install_plan_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "INSTALL-PLAN.md not found — skipping evaluation and report steps"
            echo "── Files in .otel-eval directory:"
            find "${{ github.workspace }}/.otel-eval" -type f 2>/dev/null || echo "  (none)"
            echo "install_plan_found=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Step 2: Evaluate Agent ───────────────────────────────────────────

      - name: Start evaluate-agent
        if: steps.check_install.outputs.install_plan_found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS_API_KEY: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS_API_KEY }}
          DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
        run: |
          docker run -d --name evaluate-agent \
            --network=host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}" \
            -e OTEL_EXPORTER_OTLP_HEADERS_API_KEY="${OTEL_EXPORTER_OTLP_HEADERS_API_KEY}" \
            -e DASH0_DATASET="${DASH0_DATASET}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp:/tmp \
            -v ${{ github.workspace }}/.otel-eval:/app/.otel-eval \
            -v ${{ github.workspace }}/previous-results:/app/results:ro \
            ghcr.io/${{ github.repository }}/evaluate-agent:latest

      - name: Wait for evaluate-agent to be ready
        if: steps.check_install.outputs.install_plan_found == 'true'
        run: |
          echo "Waiting for evaluate-agent on port 8080..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/; then
              echo "Ready (attempt ${i})"
              exit 0
            fi
            echo "  ${i}/30 — sleeping 3s"
            sleep 3
          done
          echo "evaluate-agent did not start within 90s"
          docker logs evaluate-agent
          exit 1

      - name: Run evaluation
        if: steps.check_install.outputs.install_plan_found == 'true'
        id: evaluate
        continue-on-error: true
        run: |
          echo "Evaluating: ${{ github.event.inputs.project_name }}"
          set +o pipefail
          curl -sS -N -X POST http://localhost:8080/api/chat \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -d "{\"conversationId\": \"eval-${{ github.event.inputs.project_name }}\", \"clusterName\": \"otel-eval-${{ github.event.inputs.project_name }}\", \"projectName\": \"${{ github.event.inputs.project_name }}\", \"projectUrl\": \"${{ github.event.inputs.project_url }}\", \"message\": \"The kind cluster otel-eval-${{ github.event.inputs.project_name }} is already running with the CNCF project installed. Evaluate its OTel maturity and generate the EVALUATION.md.\"}" \
            --max-time 3600 2>evaluate-curl-errors.txt | tee evaluate-response.txt
          CURL_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          if [[ $CURL_EXIT -ne 0 ]]; then
            echo "## Evaluation request failed" > evaluate-errors.txt
            echo "" >> evaluate-errors.txt
            echo "curl exited with code \`$CURL_EXIT\`" >> evaluate-errors.txt
            if [[ -s evaluate-curl-errors.txt ]]; then
              echo '```' >> evaluate-errors.txt
              cat evaluate-curl-errors.txt >> evaluate-errors.txt
              echo '```' >> evaluate-errors.txt
            fi
            exit $CURL_EXIT
          fi

      - name: Copy artifacts and stop evaluate-agent
        if: always() && steps.check_install.outputs.install_plan_found == 'true'
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"
          HOST_DIR="${{ github.workspace }}/.otel-eval/${PROJECT}"

          echo "── Files inside evaluate-agent container:"
          docker exec evaluate-agent find /app -maxdepth 1 -type f -name "*.md" -o -name "*.html" 2>/dev/null || true
          docker exec evaluate-agent find /app/.otel-eval -type f 2>/dev/null || true

          # Copy from all possible locations inside the container
          docker cp "evaluate-agent:/app/.otel-eval/${PROJECT}/." "${HOST_DIR}/" 2>/dev/null || true

          echo "── Files on host after extraction:"
          find "${HOST_DIR}" -type f 2>/dev/null || echo "  (none)"

          docker logs evaluate-agent > evaluate-agent-logs.txt 2>&1 || true
          docker stop evaluate-agent || true
          docker rm evaluate-agent || true

      - name: Verify EVALUATION.md exists
        if: steps.check_install.outputs.install_plan_found == 'true'
        id: check_eval
        run: |
          EVALUATION="${{ github.workspace }}/.otel-eval/${{ github.event.inputs.project_name }}/EVALUATION.md"
          if [[ -f "$EVALUATION" ]]; then
            echo "EVALUATION.md found ($(wc -l < "$EVALUATION") lines)"
            echo "evaluation_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "EVALUATION.md not found — skipping report generation"
            echo "── Files in .otel-eval directory:"
            find "${{ github.workspace }}/.otel-eval" -type f 2>/dev/null || echo "  (none)"
            echo "evaluation_found=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Step 3: Report Agent ─────────────────────────────────────────────

      - name: Start report-agent
        if: steps.check_eval.outputs.evaluation_found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS_API_KEY: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS_API_KEY }}
          DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
        run: |
          docker run -d --name report-agent \
            --network=host \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}" \
            -e OTEL_EXPORTER_OTLP_HEADERS_API_KEY="${OTEL_EXPORTER_OTLP_HEADERS_API_KEY}" \
            -e DASH0_DATASET="${DASH0_DATASET}" \
            -v ${{ github.workspace }}/.otel-eval:/app/.otel-eval \
            -v ${{ github.workspace }}/previous-results:/app/results:ro \
            ghcr.io/${{ github.repository }}/report-agent:latest

      - name: Wait for report-agent to be ready
        if: steps.check_eval.outputs.evaluation_found == 'true'
        run: |
          echo "Waiting for report-agent on port 8080..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/; then
              echo "Ready (attempt ${i})"
              exit 0
            fi
            echo "  ${i}/30 — sleeping 3s"
            sleep 3
          done
          echo "report-agent did not start within 90s"
          docker logs report-agent
          exit 1

      - name: Run report generation
        if: steps.check_eval.outputs.evaluation_found == 'true'
        id: report
        continue-on-error: true
        run: |
          echo "Generating report for: ${{ github.event.inputs.project_name }}"
          set +o pipefail
          curl -sS -N -X POST http://localhost:8080/api/chat \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -d "{\"conversationId\": \"report-${{ github.event.inputs.project_name }}\", \"clusterName\": \"otel-eval-${{ github.event.inputs.project_name }}\", \"projectName\": \"${{ github.event.inputs.project_name }}\", \"projectUrl\": \"${{ github.event.inputs.project_url }}\", \"message\": \"Generate both report.html and project-card.html from the evaluation results, following all steps in the generate-otel-report skill.\"}" \
            --max-time 3600 2>report-curl-errors.txt | tee report-response.txt
          CURL_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          if [[ $CURL_EXIT -ne 0 ]]; then
            echo "## Report generation request failed" > report-errors.txt
            echo "" >> report-errors.txt
            echo "curl exited with code \`$CURL_EXIT\`" >> report-errors.txt
            if [[ -s report-curl-errors.txt ]]; then
              echo '```' >> report-errors.txt
              cat report-curl-errors.txt >> report-errors.txt
              echo '```' >> report-errors.txt
            fi
            exit $CURL_EXIT
          fi

      - name: Copy artifacts and stop report-agent
        if: always() && steps.check_eval.outputs.evaluation_found == 'true'
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"
          HOST_DIR="${{ github.workspace }}/.otel-eval/${PROJECT}"

          echo "── Files inside report-agent container (searching all locations):"
          docker exec report-agent find /app -maxdepth 1 -type f -name "*.md" -o -name "*.html" 2>/dev/null || true
          docker exec report-agent find /app/.otel-eval -type f 2>/dev/null || true

          # Copy from all possible locations inside the container
          docker cp "report-agent:/app/.otel-eval/${PROJECT}/." "${HOST_DIR}/" 2>/dev/null || true
          # The agent may write report.html / project-card.html to the working directory /app/ directly
          docker cp "report-agent:/app/report.html" "${HOST_DIR}/report.html" 2>/dev/null || true
          docker cp "report-agent:/app/project-card.html" "${HOST_DIR}/project-card.html" 2>/dev/null || true

          echo "── Files on host after extraction:"
          find "${HOST_DIR}" -type f 2>/dev/null || echo "  (none)"

          docker logs report-agent > report-agent-logs.txt 2>&1 || true
          docker stop report-agent || true
          docker rm report-agent || true

      # ── Artifacts ────────────────────────────────────────────────────────

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-evaluation-${{ github.event.inputs.project_name }}
          path: |
            install-response.txt
            evaluate-response.txt
            report-response.txt
            install-agent-logs.txt
            evaluate-agent-logs.txt
            report-agent-logs.txt
            .otel-eval/${{ github.event.inputs.project_name }}/
            /tmp/otel-eval-${{ github.event.inputs.project_name }}/
          if-no-files-found: warn

      # ── Open PR with results ─────────────────────────────────────────────

      - name: Collect results for PR
        if: always()
        id: collect
        run: |
          SRC=".otel-eval/${{ github.event.inputs.project_name }}"
          DST="results/${{ github.event.inputs.project_name }}"

          if [[ ! -d "$SRC" ]] || [[ -z "$(ls -A "$SRC" 2>/dev/null)" ]]; then
            echo "WARNING: no evaluation files were generated at $SRC"
            exit 0
          fi

          # Copy artifacts into results/ for the PR
          mkdir -p "$DST"
          cp -r "$SRC"/. "$DST"/

          echo "── Files included in the pull request:"
          find "$DST" -type f -exec ls -lh {} \;
          echo "files_found=1" >> "$GITHUB_OUTPUT"

          # Check each expected artifact and track missing ones
          MISSING=""
          ALL_PRESENT=1
          for file in INSTALL-PLAN.md EVALUATION.md report.html project-card.html; do
            if [[ -f "$DST/$file" ]]; then
              echo "  ✓ $file"
            else
              echo "  ✗ $file — MISSING"
              MISSING="$MISSING\n- \`$file\`"
              ALL_PRESENT=0
            fi
          done

          if [[ "$ALL_PRESENT" == "1" ]]; then
            echo "report_generated=1" >> "$GITHUB_OUTPUT"
          else
            # Append missing artifacts to the error report
            touch evaluation-errors.txt
            {
              echo "## Missing evaluation artifacts"
              echo ""
              echo "The following expected files were not generated:"
              echo -e "$MISSING"
              echo ""
            } >> evaluation-errors.txt
          fi

      - name: Generate GitHub App token
        id: app-token
        if: always() && steps.collect.outputs.report_generated == '1'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: otel-maturity
          repositories: results

      - name: Push results and create PR on otel-maturity/results
        id: create-pr
        if: always() && steps.collect.outputs.report_generated == '1'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="results/${{ github.event.inputs.project_name }}"
          DST="${{ github.event.inputs.project_name }}"

          # Clone the results repo using the app token
          git clone "https://x-access-token:${GH_TOKEN}@github.com/otel-maturity/results.git" /tmp/results-repo
          cd /tmp/results-repo

          git config user.name "otel-eval-bot[bot]"
          git config user.email "otel-eval-bot[bot]@users.noreply.github.com"

          # Create or reset the branch
          git checkout -B "$BRANCH"

          # Copy evaluation artifacts
          mkdir -p "$DST"
          cp -r "${{ github.workspace }}/results/$DST"/. "$DST"/

          git add "$DST/"
          git commit -m "results: add OTel maturity evaluation for ${{ github.event.inputs.project_name }}" || {
            echo "No changes to commit"
            exit 0
          }

          git push -f origin "$BRANCH"

          # Create PR if one doesn't already exist
          EXISTING=$(gh pr list --repo otel-maturity/results --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ -z "$EXISTING" ]]; then
            gh pr create --repo otel-maturity/results \
              --title "OTel maturity report: ${{ github.event.inputs.project_name }}" \
              --body "$(cat <<EOF
          Automated OTel maturity evaluation for [${{ github.event.inputs.project_name }}](${{ github.event.inputs.project_url }}).

          All files from the \`.otel-eval/${{ github.event.inputs.project_name }}/\` evaluation directory are included.

          Triggered by @${{ github.actor }} via workflow dispatch in [otel-maturity/eval](${RUN_URL}).
          EOF
          )" \
              --base main \
              --head "$BRANCH"
          else
            echo "PR #${EXISTING} already exists — updated branch"
          fi

      - name: Verify all expected artifacts were generated
        if: always()
        run: |
          PROJECT="${{ github.event.inputs.project_name }}"
          DST="results/${PROJECT}"
          MISSING=()
          for file in INSTALL-PLAN.md EVALUATION.md report.html project-card.html; do
            if [[ ! -f "$DST/$file" ]]; then
              MISSING+=("$file")
            fi
          done

          if (( ${#MISSING[@]} > 0 )); then
            echo "::error::Evaluation incomplete — missing: ${MISSING[*]}"
            echo ""
            echo "Expected artifacts: INSTALL-PLAN.md, EVALUATION.md, report.html, project-card.html"
            echo "Missing: ${MISSING[*]}"
            echo ""
            echo "No PR was created on otel-maturity/results. Check the agent logs in the uploaded artifacts for details."
            exit 1
          fi
          echo "All expected artifacts were generated successfully"

      - name: Print agent logs on failure
        if: failure()
        run: |
          for log in install-agent-logs.txt evaluate-agent-logs.txt report-agent-logs.txt; do
            if [[ -s "$log" ]]; then
              echo "══════════════════════════════════════════════════════════"
              echo " ${log%.txt} (last 50 lines)"
              echo "══════════════════════════════════════════════════════════"
              tail -50 "$log"
              echo ""
            fi
          done
