quarkus.application.name=stability-agent
quarkus.http.port=8080

# --- Anthropic (LangChain4j) ---
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}
quarkus.langchain4j.anthropic.timeout=2h
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-6
quarkus.langchain4j.anthropic.chat-model.max-tokens=16384
quarkus.langchain4j.anthropic.chat-model.temperature=0.7
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# Tool calls per chat request. Default is 10, which is far too low for install/
# evaluate flows that may issue 30-50+ shell calls (helm install, kubectl waits,
# traffic generation, file writes). When exceeded, the LLM throws
# ToolCallsLimitExceededException and the SSE stream stalls without a useful error.
quarkus.langchain4j.ai-service.max-tool-executions=200

# Chat memory window. Default is 10 messages, which evicts the original user
# prompt after ~5 tool-call cycles and causes the agent to silently restart
# its task loop. Spring AI's MessageWindowChatMemory.builder() defaults to
# Integer.MAX_VALUE; mirror that here with a very high cap.
quarkus.langchain4j.chat-memory.memory-window.max-messages=1000

# --- Skills (loaded at runtime from .agents/skills/ populated by skills-oci install) ---
quarkus.langchain4j.skills.directories=/app/.agents/skills

# --- OpenTelemetry exporter (OTLP/HTTP to Dash0) ---
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}
quarkus.otel.exporter.otlp.headers=Authorization=Bearer ${OTEL_EXPORTER_OTLP_HEADERS_API_KEY},Dash0-Dataset=${DASH0_DATASET}
quarkus.otel.traces.sampler=always_on

# --- HTTP / streaming ---
# No global request timeout: long-running LLM calls drive the SSE stream until the AI service completes.
quarkus.http.read-timeout=2h
quarkus.http.idle-timeout=2h
