spring:
  application:
    name: evaluate-agent
  mvc:
    async:
      request-timeout: -1
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      timeout: 2h
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 16384
          temperature: 0.7
    chat:
      observations:
        include-error-logging: true
        log-completion: true
        log-prompt: true
    tools:
      observations:
        include-content: true


logging:
  level:
    org.springframework.ai: INFO
    otel-score.tools: INFO


management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        headers:
          Authorization: "Bearer ${OTEL_EXPORTER_OTLP_HEADERS_API_KEY}"
          Dash0-Dataset: "${DASH0_DATASET}"
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
          headers:
            Authorization: "Bearer ${OTEL_EXPORTER_OTLP_HEADERS_API_KEY}"
            Dash0-Dataset: "${DASH0_DATASET}"
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
          headers:
            Authorization: "Bearer ${OTEL_EXPORTER_OTLP_HEADERS_API_KEY}"
            Dash0-Dataset: "${DASH0_DATASET}"

dimension:
  agents:
    1:
      url: ${DIMENSION_1_URL:http://integration-surface-agent:8080}
    2:
      url: ${DIMENSION_2_URL:http://semantic-conventions-agent:8080}
    3:
      url: ${DIMENSION_3_URL:http://resource-attributes-agent:8080}
    4:
      url: ${DIMENSION_4_URL:http://trace-modeling-agent:8080}
    5:
      url: ${DIMENSION_5_URL:http://multi-signal-agent:8080}
    6:
      url: ${DIMENSION_6_URL:http://audience-quality-agent:8080}
    7:
      url: ${DIMENSION_7_URL:http://stability-agent:8080}

server:
  port: 8080
